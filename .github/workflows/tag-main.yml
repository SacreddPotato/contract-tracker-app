name: tag main release commit

on:
  workflow_run:
    workflows:
      - qa
    types:
      - completed

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create auto-patch tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          SHA="${{ github.event.workflow_run.head_sha }}"

          if git tag --points-at "$SHA" | grep -Eq '^v0\.1\.[0-9]+$'; then
            echo "Commit $SHA already has a v0.1.x tag."
            exit 0
          fi

          RUN_NUMBER="${{ github.run_number }}"
          TAG="v0.1.${RUN_NUMBER}"
          COUNTER=0

          while git rev-parse "$TAG" >/dev/null 2>&1; do
            COUNTER=$((COUNTER + 1))
            TAG="v0.1.$((RUN_NUMBER + COUNTER))"
          done

          git tag -a "$TAG" "$SHA" -m "Release $TAG"
          git push origin "$TAG"
          gh workflow run release-windows.yml --ref "$TAG"
