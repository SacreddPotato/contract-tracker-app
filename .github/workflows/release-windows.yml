name: release windows executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'NativePHP app version for a manual release test, without the leading v'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint check
        run: composer lint:check

      - name: Prettier check
        run: npm run format:check

      - name: ESLint check
        run: npm run lint:check

      - name: TypeScript check
        run: npm run types:check

      - name: Frontend update tests
        run: npm run test:frontend-updates

      - name: Frontend window tests
        run: npm run test:frontend-window

      - name: Frontend employee tests
        run: npm run test:frontend-employees

      - name: Frontend app API config tests
        run: npm run test:frontend-api-config

      - name: Frontend API tests
        run: npm run test:frontend-api

      - name: Frontend notification API tests
        run: npm run test:frontend-notifications

      - name: Neon migration tests
        run: npm run test:frontend-migrations

      - name: Neon schema tests
        run: npm run test:frontend-schema

      - name: Build frontend
        run: npm run build

      - name: PHP tests
        run: php artisan test

  windows:
    needs: qa
    runs-on: windows-2022
    env:
      NATIVEPHP_UPDATER_ENABLED: true
      NATIVEPHP_UPDATER_PROVIDER: github
      GITHUB_CHANNEL: latest
      GITHUB_V_PREFIXED_TAG_NAME: true
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_RELEASE_TYPE: draft
      WORKFLOW_DISPATCH_VERSION: ${{ inputs.version }}
      SPC_VERSION: 2.8.5

    steps:
      - name: Mask release variables
        shell: pwsh
        run: |
          $appApiToken = gh variable get APP_API_TOKEN --repo "${env:GITHUB_REPOSITORY}"
          $neonProductionDatabaseUrl = gh variable get NEON_PRODUCTION_DATABASE_URL --repo "${env:GITHUB_REPOSITORY}"

          if ([string]::IsNullOrWhiteSpace($appApiToken)) {
            throw 'APP_API_TOKEN repo variable is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($neonProductionDatabaseUrl)) {
            throw 'NEON_PRODUCTION_DATABASE_URL repo variable is missing.'
          }

          Write-Output "::add-mask::$appApiToken"
          Write-Output "::add-mask::$neonProductionDatabaseUrl"

          "APP_API_TOKEN=$appApiToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEON_PRODUCTION_DATABASE_URL=$neonProductionDatabaseUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Derive app version
        shell: pwsh
        run: |
          $version = if ("${env:GITHUB_EVENT_NAME}" -eq 'workflow_dispatch') {
            "${env:WORKFLOW_DISPATCH_VERSION}" -replace '^v', ''
          } else {
            "${env:GITHUB_REF_NAME}" -replace '^v', ''
          }

          if (-not ($version -match '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$')) {
            throw "Release version input does not resolve to a valid NativePHP app version."
          }

          $releaseTag = "v$version"

          "NATIVEPHP_APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG_NAME=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NativePHP app version: $version"
          Write-Host "GitHub release tag: $releaseTag"

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: fileinfo, zip, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare production environment
        shell: pwsh
        run: |
          Copy-Item .env.production.example .env
          php artisan key:generate --ansi

          $requiredVariables = @(
            'APP_API_TOKEN',
            'NEON_PRODUCTION_DATABASE_URL'
          )

          foreach ($name in $requiredVariables) {
            $value = [Environment]::GetEnvironmentVariable($name)
            $state = if ([string]::IsNullOrWhiteSpace($value)) { 'UNSET' } else { 'SET' }
            Write-Host "$name=$state"
          }

          $missing = @(
            $requiredVariables | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
            }
          )

          if ($missing.Count -gt 0) {
            throw "Missing required Neon release variables: $($missing -join ', ')"
          }

          $envPath = ".env"
          $script:envContent = Get-Content $envPath -Raw

          function Set-EnvValue([string] $name, [string] $value) {
            $escapedValue = $value -replace '"', '\"'
            $line = "$name=`"$escapedValue`""
            $pattern = "(?m)^$([regex]::Escape($name))=.*"

            if ([regex]::IsMatch($script:envContent, $pattern)) {
              $script:envContent = [regex]::Replace(
                $script:envContent,
                $pattern,
                [System.Text.RegularExpressions.MatchEvaluator] { param($match) $line }
              )
            } else {
              $script:envContent = $script:envContent.TrimEnd() + "`n$line`n"
            }
          }

          Set-EnvValue 'NATIVEPHP_APP_VERSION' $env:NATIVEPHP_APP_VERSION
          Set-EnvValue 'APP_DATA_STORE' 'neon'
          Set-EnvValue 'APP_API_TOKEN' $env:APP_API_TOKEN
          Set-EnvValue 'NEON_DEFAULT_DATABASE_BRANCH' 'production'
          Set-EnvValue 'NEON_TESTING_DATABASE_URL' ''
          Set-EnvValue 'NEON_PRODUCTION_DATABASE_URL' $env:NEON_PRODUCTION_DATABASE_URL
          Set-EnvValue 'DB_CONNECTION' 'pgsql'
          Set-EnvValue 'DB_URL' $env:NEON_PRODUCTION_DATABASE_URL
          Set-EnvValue 'DB_SSLMODE' 'require'
          Set-EnvValue 'VITE_APP_API_TOKEN' '${APP_API_TOKEN}'
          Set-EnvValue 'VITE_NEON_DATABASE_BRANCH' 'production'

          $script:envContent | Set-Content $envPath -Encoding utf8 -NoNewline

      - name: Build frontend
        run: npm run build

      - name: Build NativePHP PostgreSQL PHP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $extensions = @(
            ((Get-Content vendor/nativephp/php-bin/php-extensions.txt -Raw).Trim() -split ','),
            'pgsql',
            'pdo_pgsql'
          ) | Where-Object { $_ -and $_.Trim() -ne '' } | ForEach-Object { $_.Trim() } | Select-Object -Unique
          $extensionList = $extensions -join ','
          $libraryList = (Get-Content vendor/nativephp/php-bin/php-libraries.txt -Raw).Trim()
          $extensionHash = [System.BitConverter]::ToString(
            [System.Security.Cryptography.MD5]::HashData(
              [System.Text.Encoding]::UTF8.GetBytes($extensionList)
            )
          ).Replace('-', '').ToLowerInvariant()

          Write-Host "NativePHP PHP extensions hash: $extensionHash"
          Write-Host "NativePHP PostgreSQL extensions requested: SET"

          New-Item -ItemType Directory -Force -Path ../static-php-cli/bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/crazywhalecc/static-php-cli/releases/download/${env:SPC_VERSION}/spc-windows-x64.exe" -OutFile ../static-php-cli/bin/spc.exe

          Push-Location ../static-php-cli
          ./bin/spc.exe doctor
          if (-not (Test-Path ./php-sdk-binary-tools/bin/7za.exe)) {
            throw 'SPC PHP SDK binary tools were not installed.'
          }
          ./bin/spc.exe download --with-php=8.4 --for-extensions "$extensionList" --prefer-pre-built
          Pop-Location

          $zstdVersion = 'v1.5.7'
          Invoke-WebRequest -Uri "https://github.com/facebook/zstd/releases/download/${zstdVersion}/zstd-${zstdVersion}-win64.zip" -OutFile ../zstd.zip
          Expand-Archive -Path ../zstd.zip -DestinationPath ..
          New-Item -ItemType Directory -Force -Path ../static-php-cli/buildroot/lib, ../static-php-cli/buildroot/include | Out-Null
          Copy-Item "../zstd-${zstdVersion}-win64/static/libzstd_static.lib" ../static-php-cli/buildroot/lib/libzstd.lib
          Copy-Item "../zstd-${zstdVersion}-win64/include/*.h" ../static-php-cli/buildroot/include/
          Remove-Item -Recurse -Force ../zstd.zip, "../zstd-${zstdVersion}-win64"

          Push-Location ../static-php-cli
          ./bin/spc.exe build --build-cli "$extensionList" --with-libs="$libraryList" --debug
          $loadedExtensions = ./buildroot/bin/php.exe -m
          if ($loadedExtensions -notcontains 'pdo_pgsql') {
            throw 'Built NativePHP PHP binary is missing pdo_pgsql.'
          }
          if ($loadedExtensions -notcontains 'pgsql') {
            throw 'Built NativePHP PHP binary is missing pgsql.'
          }
          Pop-Location

          $nativePhpPath = Join-Path $PWD '.nativephp-php-bin'
          $nativePhpZipDir = Join-Path $nativePhpPath 'win/x64'
          New-Item -ItemType Directory -Force -Path $nativePhpZipDir | Out-Null
          Compress-Archive -Path ../static-php-cli/buildroot/bin/php.exe -DestinationPath (Join-Path $nativePhpZipDir 'php-8.4.zip') -Force

          "NATIVEPHP_PHP_BINARY_PATH=$nativePhpPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish NativePHP Windows app
        run: php artisan native:publish win --no-interaction

      - name: Verify release assets
        shell: pwsh
        run: |
          $releaseJson = gh release view "${env:RELEASE_TAG_NAME}" --json assets,isDraft,tagName
          $release = $releaseJson | ConvertFrom-Json

          if (-not $release.assets -or $release.assets.Count -eq 0) {
            throw "NativePHP did not publish any release assets for ${env:RELEASE_TAG_NAME}."
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $assetNames | ForEach-Object { Write-Host "Published asset: $_" }

          $hasInstaller = $assetNames | Where-Object { $_ -match '\.exe$' }
          $hasBlockmap = $assetNames | Where-Object { $_ -match '\.blockmap$' }
          $hasLatestYml = $assetNames | Where-Object { $_ -eq 'latest.yml' }

          if (-not $hasInstaller) {
            throw "Missing Windows installer asset for ${env:RELEASE_TAG_NAME}."
          }

          if (-not $hasBlockmap) {
            throw "Missing blockmap asset for ${env:RELEASE_TAG_NAME}."
          }

          if (-not $hasLatestYml) {
            throw "Missing latest.yml asset for ${env:RELEASE_TAG_NAME}."
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: gh release edit "${env:RELEASE_TAG_NAME}" --draft=false
