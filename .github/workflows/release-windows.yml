name: release windows executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint check
        run: composer lint:check

      - name: Prettier check
        run: npm run format:check

      - name: ESLint check
        run: npm run lint:check

      - name: TypeScript check
        run: npm run types:check

      - name: Frontend update tests
        run: npm run test:frontend-updates

      - name: Frontend window tests
        run: npm run test:frontend-window

      - name: Frontend employee tests
        run: npm run test:frontend-employees

      - name: Frontend Supabase config tests
        run: npm run test:frontend-supabase

      - name: Frontend API tests
        run: npm run test:frontend-api

      - name: Supabase schema tests
        run: npm run test:frontend-schema

      - name: Build frontend
        run: npm run build

      - name: PHP tests
        run: php artisan test

  windows:
    needs: qa
    runs-on: windows-latest
    env:
      NATIVEPHP_UPDATER_ENABLED: true
      NATIVEPHP_UPDATER_PROVIDER: github
      GITHUB_CHANNEL: latest
      GITHUB_V_PREFIXED_TAG_NAME: true
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_RELEASE_TYPE: draft
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Derive app version from tag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''

          if (-not ($version -match '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$')) {
            throw "Tag ${env:GITHUB_REF_NAME} does not resolve to a valid NativePHP app version."
          }

          "NATIVEPHP_APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NativePHP app version: $version"

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: fileinfo, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare production environment
        shell: pwsh
        run: |
          Copy-Item .env.production.example .env
          php artisan key:generate --ansi

          $supabaseVariables = @(
            'SUPABASE_URL',
            'SUPABASE_PUBLISHABLE_KEY'
          )

          foreach ($name in $supabaseVariables) {
            $value = [Environment]::GetEnvironmentVariable($name)
            $state = if ([string]::IsNullOrWhiteSpace($value)) { 'UNSET' } else { 'SET' }
            Write-Host "$name=$state"
          }

          $missing = @(
            $supabaseVariables | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
            }
          )

          if ($missing.Count -gt 0) {
            throw "Missing required Supabase release variables: $($missing -join ', ')"
          }

          $envPath = ".env"
          $envContent = Get-Content $envPath -Raw
          $envContent = $envContent -replace "(?m)^NATIVEPHP_APP_VERSION=.*", "NATIVEPHP_APP_VERSION=`"${env:NATIVEPHP_APP_VERSION}`""

          foreach ($name in $supabaseVariables) {
            $value = [Environment]::GetEnvironmentVariable($name)
            $escapedValue = $value -replace '"', '\"'
            $envContent = $envContent -replace "(?m)^$name=.*", "$name=`"$escapedValue`""
          }
          $envContent | Set-Content $envPath -Encoding utf8 -NoNewline

      - name: Build frontend
        run: npm run build

      - name: Publish NativePHP Windows app
        run: php artisan native:publish win --no-interaction

      - name: Verify release assets
        shell: pwsh
        run: |
          $releaseJson = gh release view "${env:GITHUB_REF_NAME}" --json assets,isDraft,tagName
          $release = $releaseJson | ConvertFrom-Json

          if (-not $release.assets -or $release.assets.Count -eq 0) {
            throw "NativePHP did not publish any release assets for ${env:GITHUB_REF_NAME}."
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $assetNames | ForEach-Object { Write-Host "Published asset: $_" }

          $hasInstaller = $assetNames | Where-Object { $_ -match '\.exe$' }
          $hasBlockmap = $assetNames | Where-Object { $_ -match '\.blockmap$' }
          $hasLatestYml = $assetNames | Where-Object { $_ -eq 'latest.yml' }

          if (-not $hasInstaller) {
            throw "Missing Windows installer asset for ${env:GITHUB_REF_NAME}."
          }

          if (-not $hasBlockmap) {
            throw "Missing blockmap asset for ${env:GITHUB_REF_NAME}."
          }

          if (-not $hasLatestYml) {
            throw "Missing latest.yml asset for ${env:GITHUB_REF_NAME}."
          }

      - name: Publish release
        shell: pwsh
        run: gh release edit "${env:GITHUB_REF_NAME}" --draft=false
